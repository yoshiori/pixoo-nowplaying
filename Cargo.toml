[package]
name = "pixoo-nowplaying"
version = "0.1.0"
edition = "2021"
description = "Show the currently playing track's artwork on a Divoom Pixoo 64"
license = "MIT"
repository = "https://github.com/yoshiori/pixoo-nowplaying"

[dependencies]
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
url = "2"

[profile.release]
strip = true
